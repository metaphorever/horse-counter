<h2>A · assembled frames (colour-coded)</h2><div class=grid id=gridA></div>
<h2>B · flat silhouette</h2><div class=grid id=gridB></div>
<h2>C · chip scale</h2><div class=strip id=gridC></div>
<h2>D · onion skin per leg (frame 1 darkest → 8 lightest) + hoof path</h2><div class=grid id=gridD></div>
<div id=stage></div>
<script>
const SRCSVG = document.querySelector('#src svg');
const LEGS = {hindFar:'',hindNear:'1',foreFar:'2',foreNear:'3'};
const COL  = {hindFar:'#231f20',hindNear:'#ec008c',foreFar:'#00aeef',foreNear:'#fff200'};
function legEl(frame,which){ return SRCSVG.querySelector('#'+CSS.escape('_x3'+frame+'_'+LEGS[which])); }
function part(id){ return SRCSVG.querySelector('#'+id); }

// build one frame svg. mode: 'color' | 'flat'
function buildFrame(f, mode, vb){
  const ns='http://www.w3.org/2000/svg';
  const s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox', vb||'25 20 620 340');
  const add=(el,fill)=>{ const c=el.cloneNode(true); c.removeAttribute('display'); c.removeAttribute('id');
    c.querySelectorAll('*').forEach(k=>k.removeAttribute('id'));
    if(fill){ c.setAttribute('fill',fill); c.querySelectorAll('*').forEach(k=>k.setAttribute('fill',fill)); }
    s.appendChild(c); return c; };
  const shade = mode==='flat' ? '#6b4a2f' : COL.foreFar;
  add(legEl(f,'foreFar'),  mode==='flat'?'#7d5636':COL.foreFar);
  add(legEl(f,'hindFar'),  mode==='flat'?'#7d5636':COL.hindFar);
  add(part('tail'), mode==='flat'?'#a8763f':'#5aa02c');
  add(part('barrel'), mode==='flat'?'#a8763f':'#c9c2b4');
  add(legEl(f,'hindNear'), mode==='flat'?'#a8763f':COL.hindNear);
  add(legEl(f,'foreNear'), mode==='flat'?'#a8763f':COL.foreNear);
  add(part('head'), mode==='flat'?'#a8763f':'#c9c2b4');
  if(mode!=='flat'){ // guides
    const g=document.createElementNS(ns,'g');
    g.innerHTML='<line x1="0" y1="210" x2="680" y2="210" stroke="#b9533a" stroke-width="1" stroke-dasharray="5 4"/>'+
      '<line x1="0" y1="315" x2="680" y2="315" stroke="#999" stroke-width="1"/>'+
      '<line x1="0" y1="343" x2="680" y2="343" stroke="#2a7" stroke-width="1"/>'+
      '<line x1="150" y1="60" x2="150" y2="360" stroke="#185fa5" stroke-width=".7" stroke-dasharray="4 3"/>'+
      '<line x1="550" y1="60" x2="550" y2="360" stroke="#185fa5" stroke-width=".7" stroke-dasharray="4 3"/>';
    s.appendChild(g);
  }
  return s;
}
for(const [gid,mode] of [['gridA','color'],['gridB','flat']]){
  const host=document.getElementById(gid);
  for(let f=1;f<=8;f++){ const d=document.createElement('div'); d.className='cell';
    d.innerHTML='<b>'+f+'</b>'; d.appendChild(buildFrame(f,mode)); host.appendChild(d); }
}
{ const host=document.getElementById('gridC');
  for(let f=1;f<=8;f++){ const d=document.createElement('div'); d.className='cell';
    d.innerHTML='<b style="font-size:10px">'+f+'</b>'; const s=buildFrame(f,'flat'); s.style.width='150px'; d.appendChild(s); host.appendChild(d);} }


// ---------- onion skin ----------
function onion(which){
  const ns='http://www.w3.org/2000/svg';
  const s=document.createElementNS(ns,'svg'); s.setAttribute('viewBox','100 90 520 280');
  const g=document.createElementNS(ns,'g');
  g.innerHTML='<line x1="0" y1="210" x2="680" y2="210" stroke="#b9533a" stroke-width="1" stroke-dasharray="5 4"/>'+
    '<line x1="0" y1="339" x2="680" y2="339" stroke="#2a7" stroke-width="1.2"/>'+
    '<line x1="150" y1="90" x2="150" y2="370" stroke="#185fa5" stroke-width=".7" stroke-dasharray="4 3"/>'+
    '<line x1="550" y1="90" x2="550" y2="370" stroke="#185fa5" stroke-width=".7" stroke-dasharray="4 3"/>';
  s.appendChild(g);
  const pts=[];
  for(let f=1;f<=8;f++){
    const el=legEl(f,which); const c=el.cloneNode(true); c.removeAttribute('display'); c.removeAttribute('id');
    c.querySelectorAll('*').forEach(k=>{k.removeAttribute('id');k.setAttribute('fill',COL[which]);});
    c.setAttribute('fill',COL[which]); c.setAttribute('opacity',(1.05-f*0.11).toFixed(2)); s.appendChild(c);
    const m=metrics(el); pts.push([m.hoofX,m.hoofY,f]);
  }
  pts.forEach(([x,y,f])=>{
    const cc=document.createElementNS(ns,'circle');
    cc.setAttribute('cx',x);cc.setAttribute('cy',y);cc.setAttribute('r',5);
    cc.setAttribute('fill','#111');s.appendChild(cc);
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',x);t.setAttribute('y',y-9);t.setAttribute('font-size','16');
    t.setAttribute('text-anchor','middle');t.setAttribute('fill','#111');t.setAttribute('font-weight','700');
    t.textContent=f;s.appendChild(t);
  });
  const pl=document.createElementNS(ns,'polyline');
  pl.setAttribute('points',pts.concat([pts[0]]).map(p=>p[0]+','+p[1]).join(' '));
  pl.setAttribute('fill','none');pl.setAttribute('stroke','#111');pl.setAttribute('stroke-width','2');
  pl.setAttribute('stroke-dasharray','6 4');s.appendChild(pl);
  return s;
}
// ---------- measurement ----------
function samplePts(el,n){
  const out=[]; let L=0; try{ L=el.getTotalLength(); }catch(e){}
  if(!L){ const b=el.getBBox(); return [{x:b.x,y:b.y},{x:b.x+b.width,y:b.y+b.height}]; }
  n=n||Math.max(400,Math.min(4000,Math.round(L/1.5)));
  for(let i=0;i<=n;i++){ const p=el.getPointAtLength(L*i/n); out.push({x:p.x,y:p.y}); }
  return out;
}
function metrics(el){
  const b=el.getBBox(), pts=samplePts(el);
  let maxY=-1e9; pts.forEach(p=>{ if(p.y>maxY) maxY=p.y; });
  const foot=pts.filter(p=>p.y>maxY-4);
  const fx=foot.map(p=>p.x);
  // width of the shape at the belly line y=210 (attachment footprint)
  const at210=pts.filter(p=>Math.abs(p.y-210)<3).map(p=>p.x);
  return { x:+b.x.toFixed(1), y:+b.y.toFixed(1), w:+b.width.toFixed(1), h:+b.height.toFixed(1),
           x2:+(b.x+b.width).toFixed(1), y2:+(b.y+b.height).toFixed(1),
           hoofY:+maxY.toFixed(1), hoofX:+((Math.min(...fx)+Math.max(...fx))/2).toFixed(1),
           hoofW:+(Math.max(...fx)-Math.min(...fx)).toFixed(1),
           top210: at210.length? [+Math.min(...at210).toFixed(1), +Math.max(...at210).toFixed(1)] : null };
}
window.measureAll=function(){
  const out={frames:{}};
  for(let f=1;f<=8;f++){ out.frames[f]={};
    for(const k in LEGS){ const el=legEl(f,k); out.frames[f][k]= el? metrics(el) : null; } }
  return out;
};
window.measureLeg=function(sel){ return metrics(SRCSVG.querySelector(sel)); };
{const host=document.getElementById('gridD');
   for(const w of ['foreNear','foreFar','hindNear','hindFar']){
     const d=document.createElement('div'); d.className='cell';
     d.innerHTML='<b style="color:#333">'+w+'</b>'; d.appendChild(onion(w)); host.appendChild(d);}}
document.title='ready';
</script>
